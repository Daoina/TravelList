<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Prep Checklist</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #2b2b2b;
    --muted: #7a7a7a;
    --accent: #2f6f5e;
    --accent-soft: #e5f1ed;
    --border: #e5e2db;
    --danger: #b3564a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px 16px 64px;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 1.6rem;
    margin: 0 0 4px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 1.1rem;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card .sub {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .progress-track {
    height: 6px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.25s ease;
  }
  ul.list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  ul.list li:last-child {
    border-bottom: none;
  }
  ul.list li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  ul.list li label {
    flex: 1;
    cursor: pointer;
    font-size: 1rem;
  }
  ul.list li.done label {
    color: var(--muted);
    text-decoration: line-through;
  }
  .remove-btn {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 1.1rem;
    cursor: pointer;
    line-height: 1;
    padding: 4px 6px;
    opacity: 0.6;
  }
  .remove-btn:hover { opacity: 1; }
  .add-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .add-row input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
  }
  .add-row button {
    padding: 10px 16px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .add-row button:hover {
    opacity: 0.9;
  }
  .empty-state {
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
    padding: 16px 0;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Trip Prep Checklist</h1>
      <p>Everything to sort out before you two head out.</p>
    </header>

    <div class="card">
      <h2>✅ To Do</h2>
      <p class="sub">Tasks to finish before you leave</p>
      <div class="progress-track"><div class="progress-fill" id="todo-progress"></div></div>
      <ul class="list" id="todo-list"></ul>
      <div class="add-row">
        <input type="text" id="todo-input" placeholder="Add a task...">
        <button id="todo-add">Add</button>
      </div>
    </div>

    <div class="card">
      <h2>🧳 Pack List</h2>
      <p class="sub">Add items as you think of them</p>
      <div class="progress-track"><div class="progress-fill" id="pack-progress"></div></div>
      <ul class="list" id="pack-list"></ul>
      <p class="empty-state" id="pack-empty">Nothing here yet — add items below.</p>
      <div class="add-row">
        <input type="text" id="pack-input" placeholder="Add a pack item...">
        <button id="pack-add">Add</button>
      </div>
    </div>

    <footer id="sync-status">Connecting live sync…</footer>
  </div>

<script>
  function renderCollection(docs, coll, listId, progressId, emptyId) {
    const listEl = document.getElementById(listId);
    listEl.innerHTML = "";
    docs.forEach(doc => {
      const data = doc.data();
      const li = document.createElement("li");
      if (data.done) li.classList.add("done");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = !!data.done;
      checkbox.id = `${listId}-${doc.id}`;
      checkbox.addEventListener("change", () => {
        coll.doc(doc.id).update({ done: checkbox.checked }).catch(err => console.error(err));
      });

      const label = document.createElement("label");
      label.htmlFor = checkbox.id;
      label.textContent = data.text;

      const removeBtn = document.createElement("button");
      removeBtn.className = "remove-btn";
      removeBtn.textContent = "✕";
      removeBtn.title = "Remove";
      removeBtn.addEventListener("click", () => {
        coll.doc(doc.id).delete().catch(err => console.error(err));
      });

      li.appendChild(checkbox);
      li.appendChild(label);
      li.appendChild(removeBtn);
      listEl.appendChild(li);
    });

    const progressEl = document.getElementById(progressId);
    const doneCount = docs.filter(d => d.data().done).length;
    const pct = docs.length ? Math.round((doneCount / docs.length) * 100) : 0;
    progressEl.style.width = pct + "%";

    if (emptyId) {
      document.getElementById(emptyId).style.display = docs.length ? "none" : "block";
    }
  }

  function wireAdd(coll, inputId, buttonId) {
    const input = document.getElementById(inputId);
    const submit = () => {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      coll.add({ text, done: false, order: Date.now() }).catch(err => console.error(err));
    };
    document.getElementById(buttonId).addEventListener("click", submit);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") submit();
    });
  }

  async function init() {
    const statusEl = document.getElementById("sync-status");
    const db = await claude.use("db");

    if (!db) {
      statusEl.textContent = "Live sync isn't available in this view.";
      return;
    }

    const todosColl = db.collection("todos");
    const packColl = db.collection("pack");

    todosColl.orderBy("order").onSnapshot(
      snap => renderCollection(snap.docs, todosColl, "todo-list", "todo-progress", null),
      err => {
        console.error("todos db error", err);
        statusEl.textContent = "Live sync error — try reloading.";
      }
    );

    packColl.orderBy("order").onSnapshot(
      snap => renderCollection(snap.docs, packColl, "pack-list", "pack-progress", "pack-empty"),
      err => {
        console.error("pack db error", err);
        statusEl.textContent = "Live sync error — try reloading.";
      }
    );

    wireAdd(todosColl, "todo-input", "todo-add");
    wireAdd(packColl, "pack-input", "pack-add");

    statusEl.textContent = "Synced live — everyone who opens this sees the same list.";
  }

  init();
</script>
</body>
</html>
